# The only compose file, run as the single project "web", so every container
# is named web-*. Both environments live here as separate services, each with
# its own tunnel and therefore its own public URL.
#
#   web-website-prod-1   web-tunnel-prod-1    <- main branch
#   web-website-dev-1    web-tunnel-dev-1     <- dev branch
#
# Profiles keep a deploy to its own side: a dev push touches only the dev
# services and leaves production running untouched.
#
#   docker compose --profile prod up -d
#   docker compose --profile dev  up -d
#
# Images are built here on the host from the checkout, so there is no registry
# to authenticate to. Only the tunnel token comes from the GitHub environment;
# nothing secret is stored on the host.
#
# Each side publishes a port for testing:
#   prod -> http://<host>:3000    dev -> http://<host>:3001
#
# These bind all interfaces, so both are reachable from anything on the VLAN.
# Note that Docker writes its own iptables rules ahead of ufw, so a ufw deny
# will NOT close them - the only way to close them is to remove the mapping, or
# to prefix it with 127.0.0.1: for loopback-only access. Worth putting back once
# the tunnel is serving traffic, since nothing else needs these ports.
services:
  website-prod:
    profiles: [prod]
    image: bg-website:prod-${PROD_SHA:-local}
    build:
      context: .
      dockerfile: dockerfile
      args:
        GIT_SHA: ${PROD_SHA:-local}
        GIT_REF: ${PROD_REF:-unknown}
        BUILD_TIME: ${PROD_BUILT:-unknown}
    ports:
      - "3000:8080"   # production, reachable on the VLAN
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=32m
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [prod]

  website-dev:
    profiles: [dev]
    image: bg-website:dev-${DEV_SHA:-local}
    build:
      context: .
      dockerfile: dockerfile
      args:
        GIT_SHA: ${DEV_SHA:-local}
        GIT_REF: ${DEV_REF:-unknown}
        BUILD_TIME: ${DEV_BUILT:-unknown}
    ports:
      - "3001:8080"   # development, reachable on the VLAN
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=32m
    cpus: 0.5
    mem_limit: 192m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [dev]



# separate networks: the two environments cannot reach each other, and both
# tunnels resolve their own website service without a name collision
networks:
  prod:
  dev: