server {
    # 8080, not 969: ports below 1024 need root to bind, and this container
    # runs as an unprivileged user so it can have a read-only filesystem.
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # the tunnel terminates TLS, so the real client address arrives in a header
    set_real_ip_from 0.0.0.0/0;
    real_ip_header   CF-Connecting-IP;

    # what the container healthcheck and the deploy smoke test use
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # build metadata, written at image build time — proves which commit is live
    location = /build.json {
        add_header Cache-Control "no-store, must-revalidate";
        default_type application/json;
    }

    # a single-page app: unknown paths are routes, not 404s
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never cache the entry document, or a deploy looks like it failed
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # hashed asset filenames, so they can be cached hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
