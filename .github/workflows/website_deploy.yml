name: website_deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the branch decides the environment; everything downstream reads it from here
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag:     ${{ steps.m.outputs.tag }}
      image:   ${{ steps.m.outputs.image }}
      env:     ${{ steps.m.outputs.env }}
      profile: ${{ steps.m.outputs.profile }}
    steps:
      - id: m
        run: |
          case "$GITHUB_REF_NAME" in
            main) tag=main; env=production;  profile=prod ;;
            dev)  tag=dev;  env=development; profile=dev  ;;
            *)    echo "::error::no environment mapped for $GITHUB_REF_NAME"
                  exit 1 ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}"   # ghcr rejects capitals
          {
            echo "tag=$tag"
            echo "env=$env"
            echo "image=$image"
            echo "profile=$profile"
          } >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME -> $env (profile $profile, tag $tag)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: meta
    # hosted: faster, cached, and keeps builds off the machine serving traffic
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./dummy-site
          file: ./dummy-site/dockerfile
          push: true
          tags: |
            ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_TIME=${{ github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [meta, build]
    runs-on: [self-hosted, linux, web]
    # the gate that decides which branch may read which environment's secrets
    environment: ${{ needs.meta.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      # a short-lived pull credential, written fresh each run
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        working-directory: dummy-site
        env:
          # one project, so every container is web-*; the profile decides which
          # half of it this branch touches
          COMPOSE_PROJECT_NAME: web
          PROFILE: ${{ needs.meta.outputs.profile }}
          TAG: ${{ needs.meta.outputs.tag }}
          TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: |
          case "$PROFILE" in prod|dev) ;; *) echo "refusing '$PROFILE'"; exit 1 ;; esac
          test -n "$TOKEN" || { echo "TUNNEL_TOKEN missing for this environment"; exit 1; }

          # only this environment's variables are set, so only its services move
          if [ "$PROFILE" = prod ]; then
            export PROD_TAG="$TAG" PROD_TUNNEL_TOKEN="$TOKEN"
          else
            export DEV_TAG="$TAG" DEV_TUNNEL_TOKEN="$TOKEN"
          fi

          # no --remove-orphans: it would tear down the other environment
          docker compose --profile "$PROFILE" pull
          docker compose --profile "$PROFILE" up -d
          docker compose ps

      - name: Drop the registry credential
        if: always()
        run: docker logout ghcr.io
