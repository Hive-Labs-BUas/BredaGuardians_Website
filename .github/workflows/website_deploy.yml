name: website_deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, svc-web]
    # the gate that decides which branch may read which environment's secrets
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the environment from the branch
        id: m
        run: |
          case "$GITHUB_REF_NAME" in
            main) profile=prod; port=3000 ;;
            dev)  profile=dev;  port=3001 ;;
            *)    echo "::error::no environment mapped for $GITHUB_REF_NAME"
                  exit 1 ;;
          esac
          {
            echo "profile=$profile"
            echo "port=$port"
          } >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME -> profile $profile on 127.0.0.1:$port" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and deploy
        working-directory: dummy-site
        env:
          COMPOSE_PROJECT_NAME: web
          PROFILE: ${{ steps.m.outputs.profile }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: |
          case "$PROFILE" in prod|dev) ;; *) echo "refusing '$PROFILE'"; exit 1 ;; esac
          test -n "$TOKEN" || { echo "TUNNEL_TOKEN missing for this environment"; exit 1; }

          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # only this environment's variables are set, so only its services move
          if [ "$PROFILE" = prod ]; then
            export PROD_SHA="$SHA" PROD_REF="$REF" PROD_BUILT="$BUILT" \
                   PROD_TUNNEL_TOKEN="$TOKEN"
          else
            export DEV_SHA="$SHA" DEV_REF="$REF" DEV_BUILT="$BUILT" \
                   DEV_TUNNEL_TOKEN="$TOKEN"
          fi

          # --pull keeps the node and nginx base images current
          docker compose --profile "$PROFILE" build --pull
          # no --remove-orphans: it would tear down the other environment
          docker compose --profile "$PROFILE" up -d
          docker compose ps

      - name: Smoke test
        env:
          PORT: ${{ steps.m.outputs.port }}
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "http://127.0.0.1:$PORT/healthz" >/dev/null; then
              echo "healthy"
              curl -s "http://127.0.0.1:$PORT/build.json"; echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::did not become healthy on 127.0.0.1:$PORT"
          docker compose -p web logs --tail=50
          exit 1

      - name: Prune images this build replaced
        if: always()
        run: docker image prune -f --filter "until=168h"